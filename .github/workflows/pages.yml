# Publishes the app to GitHub Pages on every push to main.
# `enablement: true` turns Pages on the first time this runs, so the site goes
# live without anyone opening the repository settings.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Smoke test
        run: |
          npm install --no-audit --no-fund
          npm test

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Static site: everything the app needs already sits at the repo root.
      # node_modules and the test harness are excluded from the upload.
      - name: Stage the site
        run: |
          mkdir -p _site
          cp -r index.html app.css app.js config.js manifest.webmanifest sw.js trip.ics data icon-*.png _site/
          touch _site/.nojekyll
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
